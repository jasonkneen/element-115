<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folder Interaction</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script>
      // Suppress Tailwind CDN production warning (this is a demo artifact, not a production deploy).
      (function () {
        const origWarn = console.warn;
        console.warn = function (...args) {
          if (typeof args[0] === "string" && args[0].includes("cdn.tailwindcss.com should not be used in production")) return;
          origWarn.apply(console, args);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }
      .preserve-3d, .transform-style-3d { transform-style: preserve-3d; }
      .document-scroll-container::-webkit-scrollbar { display: none; }
      @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: scale(1); }
      }
      ::selection { background-color: rgb(55 65 81); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useRef, useCallback } = React;

      // Lucide-style inline icons (stroke currentColor, 24px default)
      const Icon = ({ children, size = 24, className = "", strokeWidth = 2 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          aria-hidden="true"
        >
          {children}
        </svg>
      );
      const FileText = (p) => (
        <Icon {...p}>
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="M10 9H8" />
          <path d="M16 13H8" />
          <path d="M16 17H8" />
        </Icon>
      );
      const ImageIcon = (p) => (
        <Icon {...p}>
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
          <circle cx="9" cy="9" r="2" />
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
        </Icon>
      );
      const Music = (p) => (
        <Icon {...p}>
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </Icon>
      );
      const Video = (p) => (
        <Icon {...p}>
          <path d="m22 8-6 4 6 4V8Z" />
          <rect width="14" height="12" x="2" y="6" rx="2" ry="2" />
        </Icon>
      );
      const Paperclip = (p) => (
        <Icon {...p}>
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.93 8.83l-8.58 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
        </Icon>
      );
      const ChevronRight = (p) => (
        <Icon {...p}>
          <path d="m9 18 6-6-6-6" />
        </Icon>
      );

      const FolderInteraction = () => {
        const folderRef = useRef(null);
        const scrollRef = useRef(null);

        const [isHovered, setIsHovered] = useState(false);
        const [isOpening, setIsOpening] = useState(false); // suppresses tilt during open
        const [view, setView] = useState("folder"); // 'folder' | 'grid' | 'document'
        const [selectedId, setSelectedId] = useState(null);
        const [tilt, setTilt] = useState({ x: 0, y: 0 });
        const [shine, setShine] = useState({ x: 50, y: 50, opacity: 0 });

        const MAX_TILT = 10;
        const PERSPECTIVE = 1000;

        const items = [
          { id: 1, title: "Project Alpha", icon: <FileText className="text-slate-600" size={24} /> },
          { id: 2, title: "Design Assets", icon: <ImageIcon className="text-slate-600" size={24} /> },
          { id: 3, title: "Audio Stems",   icon: <Music className="text-slate-600" size={24} /> },
          { id: 4, title: "Video Logs",    icon: <Video className="text-slate-600" size={24} /> },
        ];

        // Folder front (the part that tucks below the tab). The tab is cut out on top.
        const folderPath =
          "M 0 24 Q 0 0 24 0 L 130 0 C 155 0 160 35 190 35 L 296 35 Q 320 35 320 59 L 320 216 Q 320 240 296 240 L 24 240 Q 0 240 0 216 Z";

        const handleMouseMove = (e) => {
          if (!folderRef.current || isOpening) return;
          if (!isHovered) setIsHovered(true);
          const rect = folderRef.current.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (rect.width / 2)));
          const ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (rect.height / 2)));
          setTilt({ x: -ny * MAX_TILT, y: nx * MAX_TILT });
          setShine({ x: 50 + nx * 40, y: 50 + ny * 40, opacity: 0.5 });
        };

        const handleMouseLeave = () => {
          if (isOpening) return;
          setIsHovered(false);
          setTilt({ x: 0, y: 0 });
          setShine((s) => ({ ...s, opacity: 0 }));
        };

        const openFolder = (e) => {
          e.stopPropagation();
          if (isOpening) return;
          setIsOpening(true);
          setView("grid");
          setTilt({ x: 0, y: 0 });
          setIsHovered(false);
        };

        const openCard = (id, e) => {
          e.stopPropagation();
          if (view !== "grid") return;
          setView("document");
          setSelectedId(id);
          setTimeout(() => {
            if (scrollRef.current) {
              const idx = items.findIndex((it) => it.id === id);
              scrollRef.current.scrollTo({ left: idx * window.innerWidth, behavior: "smooth" });
            }
          }, 50);
        };

        const goBack = () => {
          if (view === "document") {
            setView("grid");
            setSelectedId(null);
          } else if (view === "grid") {
            setView("folder");
            setIsOpening(false);
          }
        };

        return (
          <div
            className="relative w-full h-full flex items-center justify-center perspective-container"
            style={{ perspective: `${PERSPECTIVE}px` }}
            onClick={goBack}
          >
            {/* Global SVG clip path for the folder front silhouette */}
            <svg className="absolute w-0 h-0 pointer-events-none" aria-hidden="true">
              <defs>
                <clipPath id="folder-clip" clipPathUnits="userSpaceOnUse">
                  <path d={folderPath} />
                </clipPath>
              </defs>
            </svg>

            {/* Document view: horizontal scroll of full pages */}
            {view === "document" && (
              <div
                ref={scrollRef}
                className="document-scroll-container fixed inset-0 z-[200] flex overflow-x-auto overflow-y-hidden bg-black px-5"
                style={{ scrollbarWidth: "none", msOverflowStyle: "none", gap: "20px" }}
              >
                {items.map((d, i) => (
                  <div
                    key={d.id}
                    className="flex-shrink-0 h-screen flex items-center justify-center py-5"
                    onClick={goBack}
                  >
                    <div
                      className="h-full bg-gradient-to-br from-[#e0eafc] to-[#cfdef3] rounded-3xl shadow-2xl overflow-y-auto"
                      style={{
                        minWidth: "600px",
                        maxWidth: "900px",
                        width: "70vw",
                        animation: "fadeInScale 0.5s ease-out",
                        animationDelay: `${i * 50}ms`,
                        animationFillMode: "backwards",
                      }}
                      onClick={(e) => e.stopPropagation()}
                    >
                      <div className="p-12">
                        <div className="flex justify-between items-start mb-8">
                          <div className="p-4 bg-white/60 shadow-lg border border-white/50 rounded-2xl backdrop-blur-sm">
                            {d.icon}
                          </div>
                          <div className="text-slate-500 text-lg font-mono">0{d.id}</div>
                        </div>
                        <h1 className="font-bold text-5xl mb-8 text-slate-900 tracking-tight leading-tight">
                          {d.title}
                        </h1>
                        <div className="space-y-4 text-slate-700">
                          <p className="text-lg leading-relaxed">
                            This is the full document view for {d.title}. You can scroll horizontally to view other documents.
                          </p>
                          <div className="space-y-3 mt-8">
                            <div className="w-full h-3 bg-slate-900/10 rounded-full" />
                            <div className="w-5/6 h-3 bg-slate-900/10 rounded-full" />
                            <div className="w-4/5 h-3 bg-slate-900/10 rounded-full" />
                            <div className="w-full h-3 bg-slate-900/10 rounded-full" />
                            <div className="w-11/12 h-3 bg-slate-900/10 rounded-full" />
                          </div>
                          <div className="mt-12 p-6 bg-white/40 rounded-2xl border border-white/50">
                            <h2 className="font-semibold text-2xl mb-4 text-slate-900">Section Details</h2>
                            <div className="space-y-3">
                              <div className="w-full h-3 bg-slate-900/10 rounded-full" />
                              <div className="w-11/12 h-3 bg-slate-900/10 rounded-full" />
                              <div className="w-5/6 h-3 bg-slate-900/10 rounded-full" />
                            </div>
                          </div>
                          <div className="mt-8 p-6 bg-white/40 rounded-2xl border border-white/50">
                            <h2 className="font-semibold text-2xl mb-4 text-slate-900">Additional Information</h2>
                            <div className="space-y-3">
                              <div className="w-full h-3 bg-slate-900/10 rounded-full" />
                              <div className="w-4/5 h-3 bg-slate-900/10 rounded-full" />
                              <div className="w-11/12 h-3 bg-slate-900/10 rounded-full" />
                              <div className="w-3/4 h-3 bg-slate-900/10 rounded-full" />
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Back button (visible in grid & document views) */}
            {view !== "folder" && (
              <button
                onClick={goBack}
                className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[300] bg-white text-slate-900 px-6 py-3 rounded-full font-medium text-sm tracking-wide hover:bg-slate-50 transition-all duration-200 flex items-center gap-2"
                style={{ boxShadow: "0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06)" }}
                aria-label="Go back to grid view"
              >
                <span>←</span>
                <span>Back</span>
              </button>
            )}

            {/* The folder itself */}
            <div
              ref={folderRef}
              className={`relative w-80 h-60 ease-out preserve-3d ${isOpening ? "duration-500" : "duration-100"}`}
              style={{
                transform: `rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
                transformStyle: "preserve-3d",
                transitionProperty: "transform",
                transitionDuration: isHovered ? "100ms" : "300ms",
                cursor: isOpening ? "default" : "pointer",
                pointerEvents: isOpening ? "none" : "auto",
                opacity: view === "document" ? 0 : 1,
                transition: "opacity 0.3s ease-out",
              }}
              onMouseEnter={() => !isOpening && setIsHovered(true)}
              onMouseMove={handleMouseMove}
              onMouseLeave={handleMouseLeave}
              onClick={openFolder}
              role="button"
              tabIndex={0}
              aria-label="Interactive folder - click to open"
              onKeyDown={(e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  openFolder(e);
                }
              }}
            >
              {/* Back panel - sits behind everything in Z */}
              <div
                className={`absolute inset-0 bg-[#151516] rounded-[24px] -z-10 transform shadow-2xl border border-white/5 transition-all ${
                  view === "grid" ? "duration-500" : "duration-300"
                }`}
                style={{
                  opacity: view === "folder" ? 1 : 0,
                  transform:
                    view === "folder"
                      ? "scale(1) translateZ(-20px)"
                      : "scale(0.8) translateZ(-100px)",
                }}
              />

              {/* The cards layered inside the folder */}
              <div className="absolute inset-x-4 bottom-4 h-[90%] transform-style-3d z-0 flex items-end justify-center pointer-events-none">
                {items.map((d, i) => {
                  const depth = items.length - 1 - i; // deepest card = highest depth
                  const translateY = isHovered ? -15 * depth - 20 : -4 * depth - 5;
                  const translateZ = -10 * depth;
                  const scale = 1 - 0.03 * depth;
                  const rotate = isHovered ? (i % 2 === 0 ? -1 : 1) * depth : 0;
                  const brightness = isOpening ? 1 : 1 - depth * 0.08;

                  // Grid layout: 2 columns, 2 rows - matches original offsets
                  const isTop = i < 2;
                  const gridX = i % 2 === 0 ? -168 : 168;
                  const gridY = isTop ? -161 : 101;

                  return (
                    <div
                      key={d.id}
                      className={`absolute w-full h-full rounded-2xl origin-bottom overflow-hidden transition-all ${
                        view === "grid" ? "cursor-pointer hover:scale-105" : ""
                      }`}
                      style={{
                        zIndex: view === "grid" ? 100 : i + 1,
                        border: "1px solid rgba(0,0,0,0.08)",
                        boxShadow:
                          view === "grid"
                            ? "0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1)"
                            : "0 -4px 12px rgba(0,0,0,0.05), 0 8px 15px rgba(0,0,0,0.2)",
                        filter: `brightness(${brightness})`,
                        transform:
                          view === "grid"
                            ? `translate(${gridX}px, ${gridY}px) scale(1.1) rotate(0deg)`
                            : `translateY(${translateY}px) translateZ(${translateZ}px) scale(${scale}) rotate(${rotate}deg)`,
                        transitionDuration: view === "grid" ? "500ms" : "300ms",
                        transitionDelay: view === "grid" ? `${i * 50}ms` : "0ms",
                        transitionTimingFunction: "cubic-bezier(0.2, 0.8, 0.2, 1)",
                        height: view === "grid" ? "220px" : "92%",
                        pointerEvents: view === "grid" ? "auto" : "none",
                      }}
                      onClick={(e) => openCard(d.id, e)}
                      role="article"
                      aria-label={d.title}
                      tabIndex={view === "grid" ? 0 : -1}
                      onKeyDown={(e) => {
                        if (view === "grid" && (e.key === "Enter" || e.key === " ")) {
                          e.preventDefault();
                          openCard(d.id, e);
                        }
                      }}
                    >
                      <div className="absolute inset-0 bg-gradient-to-br from-[#e0eafc] to-[#cfdef3]" />
                      <div className="p-6 relative z-10 flex flex-col h-full text-slate-800">
                        <div className="flex justify-between items-start mb-4">
                          <div className="p-3 bg-white/60 shadow-sm border border-white/50 rounded-xl backdrop-blur-sm">
                            {d.icon}
                          </div>
                          <div className="text-slate-500 text-xs font-mono">0{d.id}</div>
                        </div>
                        <h3 className="font-bold text-xl mb-2 text-slate-900 tracking-tight leading-tight">
                          {d.title}
                        </h3>
                        <div className="space-y-2 mt-auto opacity-30">
                          <div className="w-full h-1.5 bg-slate-900 rounded-full" />
                          <div className="w-2/3 h-1.5 bg-slate-900 rounded-full" />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Front lip (tabbed shape, dark) */}
              <div
                className={`absolute inset-0 z-50 pointer-events-none transition-all ease-in-out ${
                  view === "grid" ? "duration-500" : "duration-300"
                }`}
                style={{
                  transform:
                    view === "folder"
                      ? "translateZ(20px)"
                      : "translateY(300px) rotateX(20deg) scale(0.4)",
                  opacity: view === "folder" ? 1 : 0.9,
                  filter: "drop-shadow(0 20px 25px rgba(0,0,0,0.6))",
                }}
              >
                <div
                  className="absolute inset-0 w-full h-full"
                  style={{
                    clipPath: "url(#folder-clip)",
                    background:
                      "linear-gradient(180deg, rgba(35,35,37,1) 0%, rgba(20,20,22,1) 100%)",
                  }}
                >
                  {/* Mouse-tracking shine */}
                  <div
                    className="absolute inset-0 transition-opacity duration-300 ease-out"
                    style={{
                      background: `radial-gradient(circle at ${shine.x}% ${shine.y}%, rgba(255,255,255,0.12) 0%, transparent 60%)`,
                      opacity: shine.opacity,
                    }}
                  />
                  {/* Bottom bar: Paperclip + NOTES + ChevronRight */}
                  <div className="absolute bottom-0 left-0 right-0 h-20 px-6 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="p-2 bg-white/5 rounded-xl border border-white/5">
                        <Paperclip className="w-5 h-5 text-gray-400" />
                      </div>
                      <span
                        className="text-xl font-medium text-gray-300"
                        style={{ letterSpacing: "4px" }}
                      >
                        NOTES
                      </span>
                    </div>
                    <div className="p-2 rounded-full hover:bg-white/10 transition-colors group/icon">
                      <ChevronRight className="w-6 h-6 text-gray-500 group-hover/icon:text-white transition-colors" />
                    </div>
                  </div>
                  {/* Top seam highlight */}
                  <div className="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent" />
                </div>
                {/* Outline stroke following the silhouette */}
                <svg className="absolute inset-0 w-full h-full pointer-events-none overflow-visible">
                  <path
                    d={folderPath}
                    fill="none"
                    stroke="rgba(255,255,255,0.1)"
                    strokeWidth="1"
                    vectorEffect="non-scaling-stroke"
                  />
                </svg>
              </div>

              {/* Soft ground shadow blob */}
              <div
                className={`absolute -bottom-16 left-1/2 -translate-x-1/2 w-64 h-12 bg-black blur-2xl transition-all ${
                  view === "grid" ? "duration-500" : "duration-300"
                }`}
                style={{
                  transform: view === "folder" ? `scale(${isHovered ? 1.1 : 1})` : "scale(0)",
                  opacity: view === "folder" ? (isHovered ? 0.4 : 0.6) : 0,
                }}
              />
            </div>
          </div>
        );
      };

      const App = () => (
        <div className="w-full h-screen bg-black flex items-center justify-center overflow-hidden font-sans">
          <FolderInteraction />
        </div>
      );

      ReactDOM.createRoot(document.getElementById("root")).render(
        <React.StrictMode><App /></React.StrictMode>
      );
    </script>
  </body>
</html>
