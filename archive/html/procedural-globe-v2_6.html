<!DOCTYPE html>
<html lang="en">
<head>

<title>Procedural Globe · v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05070d;
    overflow: hidden;
    font-family: 'DM Mono', monospace;
    color: #c8d0e0;
    height: 100vh;
  }

  }

<body>

<div class="vignette"></div>

<div class="title-block">

<div class="stats">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//   PLANET SCALE CONSTANTS
//   Model radius 2.0 maps to an Earth-sized world (R⊕ ≈ 6371 km).
//   Altitudes, atmosphere thickness, and zoom ranges derive from this.
// ═══════════════════════════════════════════════════════════════
const PLANET_RADIUS  = 2.0;
const KM_PER_UNIT    = 6371 / PLANET_RADIUS;     // ≈ 3185.5 km per scene unit
const MIN_ALTITUDE   = 0.012;                    // ~38 km — grazing the stratosphere
const MAX_ALTITUDE   = 120.0;                    // ~382,000 km — just past lunar distance
const ATMO_RADIUS    = PLANET_RADIUS * 1.08;     // 8% shell ~ exaggerated Earth (realistic would be 1.02)
const CLOUD_RADIUS   = PLANET_RADIUS * 1.025;    // 2.5% shell ~ upper troposphere
// ═══════════════════════════════════════════════════════════════
//   GLSL NOISE — Ashima simplex noise (shared vertex/fragment)
// ═══════════════════════════════════════════════════════════════

const NOISE_GLSL = `
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
      i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ *ns.x + ns.yyyy;
  vec4 y = y_ *ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

// ═══════════════════════════════════════════════════════════════
//   TERRAIN HEIGHT FUNCTION — shared vertex/fragment
// ═══════════════════════════════════════════════════════════════

const TERRAIN_GLSL = `
uniform float uSeaLevel;
uniform int   uOctaves;
uniform float uRoughness;
uniform float uScale;
uniform vec3  uSeedOffset;

const int MAX_OCT = 9;

float fbm(vec3 p, int octaves, float persistence, float lacunarity) {
  float value = 0.0;
  float amplitude = 1.0;
  float frequency = 1.0;
  float maxVal = 0.0;
  for (int i = 0; i < MAX_OCT; i++) {
    if (i >= octaves) break;
    value += amplitude * snoise(p * frequency);
    maxVal += amplitude;
    amplitude *= persistence;
    frequency *= lacunarity;
  }
  return value / maxVal;
}

// Full-quality terrain: used for vertex displacement + fragment coloring
float terrainHeight(vec3 dir) {
  vec3 p = dir * uScale + uSeedOffset;
  // Cheap single-noise domain warp (was 9 noise calls, now 3)
  vec3 q;
  q.x = snoise(p + vec3(0.0, 5.2, 1.3));
  q.y = snoise(p + vec3(5.2, 1.3, 2.7));
  q.z = snoise(p + vec3(1.3, 2.7, 5.2));
  // Main FBM (dropped the redundant base call)
  float warped = fbm(p + q * 1.2, uOctaves, uRoughness, 2.1);
  warped = warped * 0.5 + 0.5;
  // Ridge component
  float ridge = 1.0 - abs(fbm(p * 1.5 + vec3(10.0), 3, 0.5, 2.2));
  ridge = ridge * ridge;
  // Continent mask
  float continents = fbm(p * 0.35 + vec3(3.0), 3, 0.55, 2.0);
  continents = smoothstep(-0.3, 0.3, continents);

  float h = warped * 0.65 + ridge * 0.12;
  h = mix(h * 0.75, h, continents);
  h = h + continents * 0.1;
  return h;
}

// Lightweight terrain for bump-normal sampling (no warp, fewer octaves).
// Shape tracks terrainHeight at low frequencies so shading matches visual features.
float terrainHeightBump(vec3 dir) {
  vec3 p = dir * uScale + uSeedOffset;
  float warped = fbm(p, min(uOctaves, 5), uRoughness, 2.1);
  warped = warped * 0.5 + 0.5;
  float ridge = 1.0 - abs(fbm(p * 1.5 + vec3(10.0), 2, 0.5, 2.2));
  ridge = ridge * ridge;
  float continents = fbm(p * 0.35 + vec3(3.0), 3, 0.55, 2.0);
  continents = smoothstep(-0.3, 0.3, continents);
  float h = warped * 0.65 + ridge * 0.12;
  h = mix(h * 0.75, h, continents);
  h = h + continents * 0.1;
  return h;
}
`;

// ═══════════════════════════════════════════════════════════════
//   BAKE SHADERS — render terrain to an equirect texture once,
//   then every frame is just one texture fetch per fragment.
// ═══════════════════════════════════════════════════════════════

const BAKE_VERTEX_SHADER = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 1.0);
}
`;

const BAKE_FRAGMENT_SHADER = NOISE_GLSL + TERRAIN_GLSL + `
varying vec2 vUv;
const float PI = 3.14159265359;

void main() {
  // Equirectangular UV → direction on unit sphere
  float lon = (vUv.x - 0.5) * 2.0 * PI;
  float lat = (vUv.y - 0.5) * PI;
  float cosLat = cos(lat);
  vec3 dir = vec3(cosLat * cos(lon), sin(lat), cosLat * sin(lon));

  float h = terrainHeight(dir);
  float moisture = fbm(dir * uScale * 0.8 + vec3(77.3) + uSeedOffset, 3, 0.55, 2.0) * 0.5 + 0.5;

  // Analytical tangent-plane gradient (finite differences)
  vec3 up = abs(dir.y) > 0.95 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
  vec3 t1 = normalize(cross(dir, up));
  vec3 t2 = cross(dir, t1);
  float eps = 0.004;
  float h1 = terrainHeight(normalize(dir + t1 * eps));
  float h2 = terrainHeight(normalize(dir + t2 * eps));
  float g1 = (h1 - h) / eps;
  float g2 = (h2 - h) / eps;

  gl_FragColor = vec4(h, moisture, g1, g2);
}
`;

// ═══════════════════════════════════════════════════════════════
//   HELPERS — shared across main shaders
// ═══════════════════════════════════════════════════════════════

const SPHERE_UV_GLSL = `
const float PI = 3.14159265359;
vec2 dirToUV(vec3 dir) {
  float u = atan(dir.z, dir.x) / (2.0 * PI) + 0.5;
  float v = asin(clamp(dir.y, -1.0, 1.0)) / PI + 0.5;
  return vec2(u, v);
}
`;

const GLOBE_VERTEX_SHADER = SPHERE_UV_GLSL + `
uniform sampler2D uTerrainTex;
uniform float uSeaLevel;

varying vec3 vObjectDir;
varying vec3 vWorldNormal;
varying vec3 vWorldPos;

void main() {
  vec3 dir = normalize(position);
  vObjectDir = dir;

  float h = textureLod(uTerrainTex, dirToUV(dir), 0.0).r;

  float displacement = 1.0;
  if (h > uSeaLevel) {
    displacement = 1.0 + (h - uSeaLevel) * 0.08;
  } else {
    displacement = 1.0 - (uSeaLevel - h) * 0.008;
  }

  vec3 displaced = dir * 2.0 * displacement;
  vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
  vWorldPos = worldPos.xyz;
  vWorldNormal = normalize(mat3(modelMatrix) * dir);

  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const GLOBE_FRAGMENT_SHADER = SPHERE_UV_GLSL + `
precision highp float;

uniform sampler2D uTerrainTex;
uniform float uSeaLevel;
uniform vec3 uSunDir;
uniform vec3 uCameraPos;
uniform float uTime;
uniform mat3 uRotation;
uniform float uGloss;
uniform float uHaze;

varying vec3 vObjectDir;
varying vec3 vWorldNormal;
varying vec3 vWorldPos;

vec3 terrainPalette(float h, float lat, float moisture, float slope) {
  float absLat = abs(lat);

  // Water
  vec3 deepOcean  = vec3(0.030, 0.060, 0.160);
  vec3 ocean      = vec3(0.055, 0.145, 0.320);
  vec3 shallow    = vec3(0.140, 0.360, 0.560);
  vec3 reef       = vec3(0.290, 0.620, 0.650);

  // Land
  vec3 beach       = vec3(0.830, 0.770, 0.560);
  vec3 tropGrass   = vec3(0.180, 0.430, 0.200);
  vec3 tempGrass   = vec3(0.300, 0.450, 0.240);
  vec3 dryGrass    = vec3(0.570, 0.520, 0.280);
  vec3 desert      = vec3(0.720, 0.590, 0.370);
  vec3 forest      = vec3(0.120, 0.290, 0.160);
  vec3 pineforest  = vec3(0.140, 0.220, 0.170);
  vec3 tundra      = vec3(0.520, 0.550, 0.500);
  vec3 rock        = vec3(0.380, 0.350, 0.320);
  vec3 darkRock    = vec3(0.260, 0.240, 0.220);
  vec3 snow        = vec3(0.940, 0.955, 0.980);

  vec3 color;

  if (h < uSeaLevel - 0.18) {
    color = deepOcean;
  } else if (h < uSeaLevel - 0.06) {
    color = mix(deepOcean, ocean, (h - (uSeaLevel - 0.18)) / 0.12);
  } else if (h < uSeaLevel - 0.01) {
    color = mix(ocean, shallow, (h - (uSeaLevel - 0.06)) / 0.05);
  } else if (h < uSeaLevel) {
    float warmth = smoothstep(0.0, 0.5, 1.0 - absLat);
    vec3 shelf = mix(shallow, reef, warmth * 0.6);
    color = mix(shallow, shelf, (h - (uSeaLevel - 0.01)) / 0.01);
  } else {
    float elev = (h - uSeaLevel) / max(0.001, 1.0 - uSeaLevel);
    vec3 lowland;
    if (absLat > 0.72) {
      lowland = mix(tundra, snow, smoothstep(0.72, 0.92, absLat));
    } else if (moisture < 0.35 && absLat < 0.5) {
      lowland = mix(desert, dryGrass, smoothstep(0.25, 0.45, moisture));
    } else {
      float tropical = smoothstep(0.5, 0.15, absLat);
      lowland = mix(tempGrass, tropGrass, tropical * smoothstep(0.3, 0.7, moisture));
    }
    vec3 upper = (absLat > 0.5 || moisture > 0.5) ? pineforest : forest;

    float beachBand  = smoothstep(0.00, 0.015, elev);
    float lowBand    = smoothstep(0.015, 0.18, elev);
    float forestBand = smoothstep(0.18, 0.40, elev);
    float rockBand   = smoothstep(0.40, 0.65, elev);

    color = beach;
    color = mix(color, lowland, beachBand);
    color = mix(color, upper,   lowBand * 0.85);
    color = mix(color, mix(rock, darkRock, 0.4), forestBand);
    color = mix(color, rock, rockBand);

    float snowLine = mix(0.55, 0.05, smoothstep(0.3, 0.85, absLat));
    color = mix(color, snow, smoothstep(snowLine, snowLine + 0.1, elev));

    float poleIce = smoothstep(0.82, 0.96, absLat);
    color = mix(color, snow, poleIce);

    color *= 0.92 + moisture * 0.16;
  }
  return color;
}

vec3 aces(vec3 x) {
  const float a = 2.51; const float b = 0.03;
  const float c = 2.43; const float d = 0.59; const float e = 0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
}

// Cheap sin-based wave perturbation for ocean surface
vec3 oceanWaveOffset(vec3 dir, vec3 t1, vec3 t2, float t) {
  vec3 p = dir * 40.0;
  float w1 = sin(p.x + t * 0.9) * cos(p.y * 1.3 + t * 0.7);
  float w2 = sin(p.z * 1.2 - t * 0.5) * cos(p.x * 0.9 + t * 0.4);
  float w3 = sin(dot(p, vec3(1.1, 0.7, 0.9)) + t * 1.1);
  return t1 * (w1 + w3 * 0.5) * 0.04
       + t2 * (w2 + w3 * 0.5) * 0.04;
}

void main() {
  vec3 dir = normalize(vObjectDir);

  // ───────── ONE TEXTURE FETCH REPLACES ALL TERRAIN NOISE ─────────
  vec4 terrain = texture2D(uTerrainTex, dirToUV(dir));
  float h        = terrain.r;
  float moisture = terrain.g;
  float g1       = terrain.b;
  float g2       = terrain.a;

  float lat = dir.y;

  // Reconstruct tangent basis (same as bake shader — deterministic from dir)
  vec3 up = abs(dir.y) > 0.95 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
  vec3 t1 = normalize(cross(dir, up));
  vec3 t2 = cross(dir, t1);
  vec3 grad = t1 * g1 + t2 * g2;
  float strength = (h > uSeaLevel) ? 3.2 : 0.9;
  vec3 bumpedLocal = normalize(dir - grad * strength);
  vec3 N = normalize(uRotation * bumpedLocal);

  vec3 V = normalize(uCameraPos - vWorldPos);
  vec3 L = normalize(uSunDir);
  vec3 H = normalize(L + V);

  float slope = 1.0 - clamp(dot(N, normalize(vWorldNormal)), 0.0, 1.0);
  vec3 albedo = terrainPalette(h, lat, moisture, slope);

  // ───────── Lighting ─────────
  float NdotL = max(dot(N, L), 0.0);
  float NdotV = max(dot(N, V), 0.0);

  // Half-Lambert wrap for softer fill on the shadow side
  float wrap = max((dot(N, L) + 0.3) / 1.3, 0.0);
  vec3 ambient = vec3(0.10, 0.14, 0.22) * 0.7;
  vec3 skyFill = vec3(0.20, 0.30, 0.50) * 0.35 * (N.y * 0.5 + 0.5);

  vec3 sunColor = vec3(1.08, 1.00, 0.90);
  vec3 lit = albedo * (ambient + skyFill + wrap * sunColor);

  // Self-shadow sharpening: pushes mountain-face shadows darker
  float selfShadow = smoothstep(-0.05, 0.12, dot(N, L));
  lit *= mix(0.55, 1.0, selfShadow);

  // ───────── Water ─────────
  bool isWater = h < uSeaLevel;
  if (isWater) {
    // Animated wave normal perturbation
    vec3 waveOffset = oceanWaveOffset(dir, t1, t2, uTime);
    vec3 Nw = normalize(bumpedLocal + waveOffset);
    vec3 Nww = normalize(uRotation * Nw);
    vec3 Hw = normalize(L + V);

    float shininess = mix(28.0, 220.0, uGloss);
    float specIntensity = mix(0.15, 2.2, uGloss);
    float spec = pow(max(dot(Nww, Hw), 0.0), shininess);
    vec3 specColor = vec3(1.0, 0.95, 0.85) * spec * specIntensity;

    float fresnel = pow(1.0 - max(dot(Nww, V), 0.0), 5.0);
    fresnel = mix(0.02, 1.0, fresnel);
    float fresnelStrength = mix(0.12, 0.6, uGloss);

    vec3 skyRefl = mix(vec3(0.15, 0.25, 0.45), vec3(0.45, 0.65, 0.85), max(Nww.y, 0.0));
    lit = mix(lit, skyRefl, fresnel * fresnelStrength);
    lit += specColor * max(dot(Nww, L), 0.0);

    // Sun glint: broad wavelet shimmer near the sun-reflection vector
    float glint = pow(max(dot(Nww, Hw), 0.0), 80.0);
    lit += vec3(1.0, 0.95, 0.8) * glint * uGloss * 0.6 * NdotL;
  } else {
    float spec = pow(max(dot(N, H), 0.0), 40.0) * 0.08 * mix(0.3, 1.0, uGloss);
    lit += vec3(spec);
  }

  // ───────── Atmospheric scattering (simplified Rayleigh + Mie) ─────────
  float rim = pow(1.0 - NdotV, 2.5);
  float sunAlign = max(dot(L, V), 0.0);
  // Rayleigh: blue, proportional to (1 + cos²θ)
  vec3 rayleigh = vec3(0.25, 0.50, 0.92) * (0.5 + 0.5 * sunAlign * sunAlign);
  // Mie: warm forward scatter, tight lobe
  vec3 mie = vec3(1.0, 0.78, 0.50) * pow(sunAlign, 5.0) * 1.2;
  vec3 atmosphere = rayleigh * 0.35 + mie * 0.8;
  lit += atmosphere * rim * (0.15 + uHaze * 0.95);

  // Grazing-angle haze veil on land
  if (!isWater) {
    float graze = pow(1.0 - NdotV, 1.6);
    float sunward = smoothstep(-0.1, 0.4, dot(normalize(vWorldNormal), L));
    vec3 hazeTint = mix(vec3(0.32, 0.44, 0.62), vec3(0.95, 0.72, 0.50),
                        pow(sunAlign, 3.0));
    lit = mix(lit, hazeTint, graze * uHaze * 0.4 * sunward);
  }

  // ───────── Terminator with warm sunset band ─────────
  float sunDot = dot(normalize(vWorldNormal), L);
  float day    = smoothstep(-0.05, 0.35, sunDot);
  float sunset = exp(-pow((sunDot - 0.02) * 5.0, 2.0));
  vec3 sunsetTint = vec3(1.20, 0.55, 0.32);
  lit += albedo * sunsetTint * sunset * 0.35;

  vec3 nightTint = vec3(0.012, 0.018, 0.038);
  lit = mix(nightTint + albedo * 0.03, lit, day);

  // ───────── Tonemap + output ─────────
  lit = aces(lit * 1.08);
  lit = pow(lit, vec3(1.0 / 1.08));

  gl_FragColor = vec4(lit, 1.0);
}
`;

// ═══════════════════════════════════════════════════════════════
//   CLOUD SHADER
// ═══════════════════════════════════════════════════════════════

const CLOUD_VERTEX = NOISE_GLSL + `
varying vec3 vDir;
varying vec3 vWorldPos;
varying vec3 vWorldN;
void main() {
  vDir = normalize(position);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vWorldN = normalize(mat3(modelMatrix) * vDir);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

const CLOUD_FRAGMENT = NOISE_GLSL + `
uniform float uTime;
uniform vec3  uSunDir;
uniform vec3  uCameraPos;
uniform vec3  uSeedOffset;
varying vec3 vDir;
varying vec3 vWorldPos;
varying vec3 vWorldN;

float fbmC(vec3 p, int n) {
  float v = 0.0, a = 1.0, f = 1.0, m = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= n) break;
    v += a * snoise(p * f);
    m += a; a *= 0.5; f *= 2.1;
  }
  return v / m;
}

void main() {
  vec3 p = vDir * 3.0 + uSeedOffset * 0.3 + vec3(uTime * 0.008, uTime * 0.004, 0.0);
  // Swirl by cheap domain warp (single noise per component)
  vec3 warp;
  warp.x = snoise(p + vec3(2.1));
  warp.y = snoise(p + vec3(5.3));
  warp.z = snoise(p + vec3(7.7));
  float c = fbmC(p + warp * 0.8, 4) * 0.5 + 0.5;

  // Cloud cutoff
  float cloud = smoothstep(0.52, 0.78, c);
  // Thin band variation (no clouds over poles, heavier at mid-lat)
  float latBand = 1.0 - abs(vDir.y) * 0.9;
  cloud *= latBand;

  if (cloud < 0.01) discard;

  vec3 L = normalize(uSunDir);
  vec3 V = normalize(uCameraPos - vWorldPos);
  float NdotL = max(dot(vWorldN, L), 0.0);
  float terminator = smoothstep(-0.2, 0.3, NdotL);

  vec3 sunlit = mix(vec3(0.4, 0.45, 0.55), vec3(1.0, 0.98, 0.95), NdotL);
  vec3 col = sunlit * mix(0.15, 1.0, terminator);

  gl_FragColor = vec4(col, cloud * 0.65);
}
`;

// ═══════════════════════════════════════════════════════════════
//   ATMOSPHERE SHADER
// ═══════════════════════════════════════════════════════════════

const ATMO_VERTEX = `
varying vec3 vWorldN;
varying vec3 vWorldPos;
void main() {
  vWorldN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

const ATMO_FRAGMENT = `
uniform vec3 uSunDir;
uniform vec3 uCameraPos;
uniform float uHaze;
varying vec3 vWorldN;
varying vec3 vWorldPos;
void main() {
  vec3 V = normalize(uCameraPos - vWorldPos);
  vec3 L = normalize(uSunDir);
  vec3 N = normalize(vWorldN);

  // Grazing factor: thick atmosphere at rim, thin at center
  float nDotV = max(dot(N, -V), 0.0);
  float depth = pow(1.0 - nDotV, 2.2);

  // Cos of angle between view direction and sun
  float sunCos = dot(L, -V);

  // Rayleigh phase: (3/4)(1 + cos²θ), symmetric
  float rayleighPhase = 0.75 * (1.0 + sunCos * sunCos);

  // Mie phase (Henyey-Greenstein), strong forward scatter near sun
  float g = 0.76;
  float miePhase = (1.0 - g*g) / pow(max(1.0 + g*g - 2.0*g*sunCos, 0.001), 1.5);
  miePhase *= 0.08;

  // Rayleigh blue, Mie warm. Mie only when looking near sun.
  vec3 rayleighCol = vec3(0.20, 0.50, 0.98);
  vec3 mieCol      = vec3(1.00, 0.70, 0.42);
  float sunFront = smoothstep(-0.2, 0.6, sunCos);

  vec3 col = rayleighCol * rayleighPhase * 0.75
           + mieCol * miePhase * sunFront * 2.2;

  // Only the lit hemisphere of the atmosphere glows
  float sunSide = max(dot(N, L), 0.0);
  col *= 0.25 + sunSide * 1.3;

  float alpha = depth * (0.35 + uHaze * 1.8);
  alpha = clamp(alpha, 0.0, 0.95);

  gl_FragColor = vec4(col, alpha);
}
`;

// ═══════════════════════════════════════════════════════════════
//   SCENE SETUP
// ═══════════════════════════════════════════════════════════════

let scene, camera, renderer, globe, cloudMesh, atmoMesh;
let bakeScene, bakeCamera, bakeMaterial, terrainTarget;
let clock = new THREE.Clock();
let isDragging = false;
let prevMouse = {x: 0, y: 0};
let rotVel = {x: 0, y: 0.0015};
let currentSeed = Math.floor(Math.random() * 99999);
let fpsCounter = { frames: 0, lastTime: performance.now(), fps: 0 };

const params = {
  seaLevel: 0.52,
  octaves: 8,
  roughness: 0.52,
  noiseScale: 2.2,
  sunAngle: 45,
  gloss: 0.35,
  haze: 0.55,
};

function seedToOffset(seed) {
  // Hash seed into 3 floats
  const s1 = Math.sin(seed * 12.9898) * 43758.5453;
  const s2 = Math.sin(seed * 78.233)  * 43758.5453;
  const s3 = Math.sin(seed * 39.346)  * 43758.5453;
  return new THREE.Vector3(
    (s1 - Math.floor(s1)) * 200 - 100,
    (s2 - Math.floor(s2)) * 200 - 100,
    (s3 - Math.floor(s3)) * 200 - 100,
  );
}

function rebakeTerrain() {
  if (!bakeScene || !terrainTarget) return;
  bakeMaterial.uniforms.uOctaves.value   = params.octaves;
  bakeMaterial.uniforms.uRoughness.value = params.roughness;
  bakeMaterial.uniforms.uScale.value     = params.noiseScale;
  bakeMaterial.uniforms.uSeedOffset.value.copy(seedToOffset(currentSeed));

  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(terrainTarget);
  renderer.render(bakeScene, bakeCamera);
  renderer.setRenderTarget(prevTarget);
}

function buildGlobe() {
  if (globe) { scene.remove(globe); globe.geometry.dispose(); globe.material.dispose(); }
  if (cloudMesh) { scene.remove(cloudMesh); cloudMesh.geometry.dispose(); cloudMesh.material.dispose(); }
  if (atmoMesh) { scene.remove(atmoMesh); atmoMesh.geometry.dispose(); atmoMesh.material.dispose(); }

  // Bake terrain texture first so geometry can sample it
  rebakeTerrain();

  const detail = 260;  // high silhouette, but much less than before
  const geo = new THREE.SphereGeometry(2, detail, detail);
  const seedOffset = seedToOffset(currentSeed);

  const sunDir = new THREE.Vector3(
    Math.cos(params.sunAngle * Math.PI / 180),
    0.4,
    Math.sin(params.sunAngle * Math.PI / 180)
  ).normalize();

  const material = new THREE.ShaderMaterial({
    vertexShader: GLOBE_VERTEX_SHADER,
    fragmentShader: GLOBE_FRAGMENT_SHADER,
    uniforms: {
      uTerrainTex:  { value: terrainTarget.texture },
      uSeaLevel:    { value: params.seaLevel },
      uSunDir:      { value: sunDir },
      uCameraPos:   { value: camera.position.clone() },
      uTime:        { value: 0 },
      uRotation:    { value: new THREE.Matrix3() },
      uGloss:       { value: params.gloss },
      uHaze:        { value: params.haze },
    },
  });

  globe = new THREE.Mesh(geo, material);
  scene.add(globe);

  // Cloud mesh
  const cloudGeo = new THREE.SphereGeometry(CLOUD_RADIUS, 96, 96);
  const cloudMat = new THREE.ShaderMaterial({
    vertexShader: CLOUD_VERTEX,
    fragmentShader: CLOUD_FRAGMENT,
    uniforms: {
      uTime:       { value: 0 },
      uSunDir:     { value: sunDir },
      uCameraPos:  { value: camera.position.clone() },
      uSeedOffset: { value: seedOffset },
    },
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide,
  });
  cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
  scene.add(cloudMesh);

  // Atmosphere
  const atmoGeo = new THREE.SphereGeometry(ATMO_RADIUS, 64, 64);
  const atmoMat = new THREE.ShaderMaterial({
    vertexShader: ATMO_VERTEX,
    fragmentShader: ATMO_FRAGMENT,
    uniforms: {
      uSunDir:    { value: sunDir },
      uCameraPos: { value: camera.position.clone() },
      uHaze:      { value: params.haze },
    },
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
  scene.add(atmoMesh);

  document.getElementById('seedVal').textContent = currentSeed.toString().padStart(5, '0');
  document.getElementById('vertVal').textContent = geo.attributes.position.count.toLocaleString();
}

function updateUniforms() {
  if (!globe) return;
  globe.material.uniforms.uSeaLevel.value = params.seaLevel;
  globe.material.uniforms.uGloss.value    = params.gloss;
  globe.material.uniforms.uHaze.value     = params.haze;
  atmoMesh.material.uniforms.uHaze.value  = params.haze;

  const sunDir = new THREE.Vector3(
    Math.cos(params.sunAngle * Math.PI / 180),
    0.4,
    Math.sin(params.sunAngle * Math.PI / 180)
  ).normalize();
  globe.material.uniforms.uSunDir.value.copy(sunDir);
  cloudMesh.material.uniforms.uSunDir.value.copy(sunDir);
  atmoMesh.material.uniforms.uSunDir.value.copy(sunDir);
}

function init() {
  scene = new THREE.Scene();
  scene.fog = null;

  camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.001, 10000);
  camera.position.set(0, 0.2, 7.2);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance',
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x05070d);
  document.body.prepend(renderer.domElement);

  // ─── Terrain bake pipeline ────────────────────────
  terrainTarget = new THREE.WebGLRenderTarget(2048, 1024, {
    format: THREE.RGBAFormat,
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    wrapS: THREE.RepeatWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    generateMipmaps: false,
    depthBuffer: false,
    stencilBuffer: false,
  });

  bakeScene = new THREE.Scene();
  bakeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  bakeMaterial = new THREE.ShaderMaterial({
    vertexShader: BAKE_VERTEX_SHADER,
    fragmentShader: BAKE_FRAGMENT_SHADER,
    uniforms: {
      uSeaLevel:   { value: params.seaLevel },  // unused by bake but required by shared block
      uOctaves:    { value: params.octaves },
      uRoughness:  { value: params.roughness },
      uScale:      { value: params.noiseScale },
      uSeedOffset: { value: seedToOffset(currentSeed) },
    },
  });
  const bakeMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMaterial);
  bakeScene.add(bakeMesh);

  // ─── Starfield: celestial sphere at effectively infinite distance ───
  const starGeo = new THREE.BufferGeometry();
  const starCount = 5000;
  const starPositions = new Float32Array(starCount * 3);
  const starColors = new Float32Array(starCount * 3);
  const starSizes = new Float32Array(starCount);
  const STAR_SHELL = 2000;  // far enough that camera translation doesn't parallax them
  for (let i = 0; i < starCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPositions[i*3]   = STAR_SHELL * Math.sin(phi) * Math.cos(theta);
    starPositions[i*3+1] = STAR_SHELL * Math.sin(phi) * Math.sin(theta);
    starPositions[i*3+2] = STAR_SHELL * Math.cos(phi);
    const temp = Math.random();
    let r_, g_, b_;
    if (temp < 0.7) { r_ = 0.9; g_ = 0.92; b_ = 1.0; }         // white
    else if (temp < 0.85) { r_ = 1.0; g_ = 0.8; b_ = 0.6; }    // warm
    else if (temp < 0.95) { r_ = 0.6; g_ = 0.7; b_ = 1.0; }    // blue
    else { r_ = 1.0; g_ = 0.5; b_ = 0.4; }                     // red giant
    const bright = 0.35 + Math.random() * 0.65;
    starColors[i*3] = r_ * bright;
    starColors[i*3+1] = g_ * bright;
    starColors[i*3+2] = b_ * bright;
    starSizes[i] = Math.pow(Math.random(), 3) * 2.2 + 0.4;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

  const starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      uniform float uTime;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // Screen-space constant size (not attenuated by distance)
        float twinkle = 0.85 + 0.15 * sin(uTime * 2.0 + position.x * 3.7 + position.y * 1.3);
        gl_PointSize = size * twinkle;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float a = smoothstep(0.5, 0.0, d);
        a = pow(a, 2.0);
        gl_FragColor = vec4(vColor, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: false,  // stars always behind everything
    blending: THREE.AdditiveBlending,
  });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  stars.userData.material = starMat;
  scene.add(stars);
  scene.userData.stars = stars;

  buildGlobe();

  // ─── Planet-scale interaction ─────────────────────
  // Helper: current altitude above surface in scene units
  function getAltitude() {
    return Math.max(0, camera.position.length() - PLANET_RADIUS);
  }

  // Adapt near/far clip planes to current altitude so we get consistent depth
  // precision at any distance, without needing a log depth buffer.
  function updateCameraClipPlanes() {
    const d = camera.position.length();
    const alt = getAltitude();
    // Near scales with altitude; floor keeps it reasonable when grazing
    camera.near = Math.max(0.0005, alt * 0.01);
    // Far must reach the star shell regardless of where we are
    camera.far = Math.max(100, d + 2500);
    camera.updateProjectionMatrix();
  }

  // Interaction
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMouse = {x: e.clientX, y: e.clientY};
  });
  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    // Drag sensitivity falls off as we approach the surface: closer = finer control.
    // At max altitude (120) a pixel ≈ 0.005 rad. Near surface ≈ 0.0005 rad.
    const alt = getAltitude();
    const sensitivity = 0.0005 + Math.min(0.005, alt * 0.0005);
    rotVel.y = dx * sensitivity;
    rotVel.x = dy * sensitivity;
    prevMouse = {x: e.clientX, y: e.clientY};
  });
  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);

  // Exponential zoom: each wheel tick multiplies altitude by a constant factor.
  // This lets us fluidly navigate from low orbit to lunar distance.
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const dir = camera.position.clone().normalize();
    const alt = getAltitude();
    const factor = Math.exp(e.deltaY * 0.0015);
    const newAlt = Math.max(MIN_ALTITUDE, Math.min(MAX_ALTITUDE, alt * factor));
    camera.position.copy(dir).multiplyScalar(PLANET_RADIUS + newAlt);
    updateCameraClipPlanes();
  }, { passive: false });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // UI wiring
  // rebake: true if this param affects the baked terrain (octaves, roughness, scale)
  const wire = (id, key, div, suffix = '', rebake = false) => {
    const el = document.getElementById(id);
    const valEl = document.getElementById(id + 'Val');
    el.addEventListener('input', () => {
      const raw = parseFloat(el.value);
      params[key] = key === 'octaves' ? parseInt(el.value) : raw / div;
      if (key === 'octaves') valEl.textContent = el.value;
      else if (key === 'sunAngle') valEl.textContent = Math.round(raw) + '°';
      else valEl.textContent = (raw / div).toFixed(2);
      if (key === 'sunAngle') { params.sunAngle = raw; }
      if (rebake) rebakeTerrain();
      updateUniforms();
    });
  };
  wire('seaLevel', 'seaLevel', 100);
  wire('octaves', 'octaves', 1, '', true);
  wire('roughness', 'roughness', 100, '', true);
  wire('noiseScale', 'noiseScale', 10, '', true);
  wire('sunAngle', 'sunAngle', 1, '°');
  wire('gloss', 'gloss', 100);
  wire('haze', 'haze', 100);

  document.getElementById('regenBtn').addEventListener('click', () => {
    currentSeed = Math.floor(Math.random() * 99999);
    document.getElementById('loading').classList.remove('hidden');
    requestAnimationFrame(() => {
      buildGlobe();
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 300);
    });
  });

  // Hide loading after initial build
  setTimeout(() => document.getElementById('loading').classList.add('hidden'), 200);
}

function formatAltitude(altUnits) {
  const km = altUnits * KM_PER_UNIT;
  if (km < 10)      return km.toFixed(2) + ' km';
  if (km < 1000)    return km.toFixed(0) + ' km';
  if (km < 100000)  return (km / 1000).toFixed(1) + 'k km';
  return (km / 1000).toFixed(0) + 'k km';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  if (!isDragging) {
    rotVel.x *= 0.94;
    // Auto-spin rate also scales with altitude — a lone close-up pixel shouldn't
    // rotate the whole planet every frame.
    const alt = Math.max(0, camera.position.length() - PLANET_RADIUS);
    const targetSpin = 0.00015 + Math.min(0.0015, alt * 0.00015);
    rotVel.y += (targetSpin - rotVel.y) * 0.02;
  }

  // Keep clip planes honest at whatever altitude we've drifted to
  updateCameraClipPlanes();

  if (globe) {
    globe.rotation.x += rotVel.x;
    globe.rotation.y += rotVel.y;
    globe.updateMatrixWorld();
    globe.material.uniforms.uTime.value = time;
    globe.material.uniforms.uCameraPos.value.copy(camera.position);
    globe.material.uniforms.uRotation.value.setFromMatrix4(globe.matrixWorld);
  }
  if (cloudMesh) {
    cloudMesh.rotation.x = globe.rotation.x;
    cloudMesh.rotation.y = globe.rotation.y;
    cloudMesh.material.uniforms.uTime.value = time;
    cloudMesh.material.uniforms.uCameraPos.value.copy(camera.position);
  }
  if (atmoMesh) {
    atmoMesh.material.uniforms.uCameraPos.value.copy(camera.position);
  }
  if (scene.userData.stars) {
    scene.userData.stars.userData.material.uniforms.uTime.value = time;
    scene.userData.stars.rotation.y += 0.00005;
  }

  renderer.render(scene, camera);

  // FPS + altitude display
  fpsCounter.frames++;
  const now = performance.now();
  if (now - fpsCounter.lastTime > 500) {
    fpsCounter.fps = Math.round((fpsCounter.frames * 1000) / (now - fpsCounter.lastTime));
    document.getElementById('fpsVal').textContent = fpsCounter.fps;
    document.getElementById('altVal').textContent = formatAltitude(
      Math.max(0, camera.position.length() - PLANET_RADIUS)
    );
    fpsCounter.frames = 0;
    fpsCounter.lastTime = now;
  }
}

init();
animate();
</script>
